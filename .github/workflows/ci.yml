name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Lightweight honesty and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src scripts

      - name: Validate imports and static fixtures
        run: python scripts/test_setup.py

      - name: Validate evidence guardrails
        run: python scripts/ci_validate_evidence.py

      - name: Regenerate publication artifacts from current outputs
        run: python scripts/generate_publication_artifacts.py --mode quick
