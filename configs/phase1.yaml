experiment:
  name: gnn_rl_traffic_control
  seed: 42
  output_dir: outputs/phase1

sumo:
  net_file: data/raw/grid_3x3.net.xml
  route_file: data/raw/grid_3x3.rou.xml
  simulation_steps: 3600
  step_length: 1.0
  gui: false

model:
  use_gnn: true
  feature_dim: 12
  hidden_dim: 128
  embedding_dim: 64
  gnn_layers: 3
  gnn_type: gat
  gat_heads: 4
  dropout: 0.1

rl:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048  # Increased for Baseline stability
  batch_size: 512 # Increased for GPU saturation
  n_epochs: 15
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01 # Added entropy for better exploration
  vf_coef: 0.5
  max_grad_norm: 0.5

reward:
  waiting_time_weight: 0.1
  queue_length_weight: 0.05
  anomaly_weight: 0.0
  throughput_weight: 0.0
  pressure_weight: 0.0002
  speed_reward_weight: 0.5
  max_throughput_per_step: 20.0
  normalize: true
  time_penalty_per_step: 0.01

training:
  total_timesteps: 200000 # Increased for convergence
  eval_freq: 5000
  eval_episodes: 10
  save_freq: 10000
  log_interval: 10
  device: auto

evaluation:
  num_episodes: 100
  deterministic: true
  render: false
  seeds: [42, 43, 44, 45, 46]

output:
  checkpoint_dir: outputs/phase1/checkpoints
  log_dir: outputs/phase1/logs
  optimized_model_dir: outputs/phase1/optimized_models
  final_model_path: marl_ppo_traffic.zip
