evaluation:
  deterministic: true
  num_episodes: 100
  render: false
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
experiment:
  name: gnn_rl_traffic_control
  output_dir: outputs/phase1
  seed: 42
model:
  dropout: 0.1
  embedding_dim: 32
  feature_dim: 12
  gat_heads: 2
  gnn_layers: 2
  gnn_type: gat
  hidden_dim: 64
  use_gnn: true
output:
  best_model_dir: outputs/phase1/best_models
  checkpoint_dir: outputs/phase1/checkpoints
  final_model_path: outputs/phase1/dqn_traffic_final.zip
  log_dir: outputs/phase1/logs
reward:
  anomaly_weight: 0.0
  max_throughput_per_step: 20.0
  normalize: true
  pressure_weight: 0.0002
  queue_length_weight: 0.05
  speed_reward_weight: 0.5
  throughput_weight: 0.0
  time_penalty_per_step: 0.01
  waiting_time_weight: 0.1
rl:
  algorithm: PPO
  batch_size: 64
  clip_range: 0.2
  ent_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_grad_norm: 0.5
  n_epochs: 10
  n_steps: 2048
  policy: MlpPolicy
  vf_coef: 0.5
sumo:
  config_file: data/raw/grid_5x5.sumocfg
  gui: false
  net_file: data/raw/grid_5x5.net.xml
  route_file: data/raw/grid_5x5_medium.rou.xml
  simulation_steps: 3600
  step_length: 1.0
training:
  device: auto
  eval_episodes: 10
  eval_freq: 5000
  log_interval: 10
  save_freq: 10000
  total_timesteps: 10000
