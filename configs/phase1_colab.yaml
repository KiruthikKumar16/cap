experiment:
  name: colab_proof_grid_3x3
  seed: 42
  output_dir: outputs/phase1

sumo:
  net_file: data/raw/grid_3x3.net.xml
  route_file: data/raw/grid_3x3.rou.xml
  config_file: data/raw/grid_3x3.sumocfg
  step_length: 1.0
  simulation_steps: 600
  gui: false

model:
  use_gnn: false
  feature_dim: 12
  hidden_dim: 64
  embedding_dim: 32
  gnn_layers: 2
  gnn_type: gat
  gat_heads: 2
  dropout: 0.1

rl:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

reward:
  waiting_time_weight: 0.1
  queue_length_weight: 0.05
  anomaly_weight: 0.0
  throughput_weight: 0.0
  pressure_weight: 0.0002
  speed_reward_weight: 0.5
  max_throughput_per_step: 20.0
  normalize: true
  time_penalty_per_step: 0.01

training:
  total_timesteps: 10000
  eval_freq: 2000
  eval_episodes: 3
  save_freq: 5000
  log_interval: 10
  device: auto

evaluation:
  num_episodes: 3
  deterministic: true
  render: false
  seeds: [42, 43, 44]
  action_trace_steps: 8

output:
  checkpoint_dir: outputs/phase1/checkpoints
  log_dir: outputs/phase1/logs
  best_model_dir: outputs/phase1/best_models
  final_model_path: marl_ppo_traffic.zip
